[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-few"
version = "0.2.0.dev1"
description = "A user-owned feed-to-podcast pipeline"
requires-python = ">=3.10"
dependencies = ["feedparser>=6.0,<7", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
youtube = ["yt-dlp>=2025.1.1", "youtube-transcript-api>=1.0,<2"]

[project.scripts]
few = "the_few.cli:main"

[tool.setuptools.packages.find]
include = ["the_few*"]

[tool.setuptools.package-data]
the_few = ["migrations/*.sql"]
