[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focu"
version = "0.2.0"
description = "Agent-native research intent and evidence handoff"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
daily = ["feedparser>=6.0", "pyyaml>=6.0", "yt-dlp>=2025.1.1", "youtube-transcript-api>=0.6"]

[project.scripts]
focu = "focu.cli:main"

[tool.setuptools.packages.find]
include = ["focu*"]

[tool.setuptools.package-data]
focu = ["reader_assets/*", "source_packs/*.json"]
