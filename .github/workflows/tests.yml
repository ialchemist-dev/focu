name: Focu Python tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CLI package
        run: python -m pip install -e .
      - name: CLI installation smoke test
        run: |
          focu --help
          focu --db /tmp/focu-smoke.sqlite3 init
          focu --db /tmp/focu-smoke.sqlite3 capture "What is advertising?"
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run HTTP fixture tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Muse Artifact publisher and reader regression tests
        run: |
          cd experiments/muse-artifact-reader
          python -m unittest discover -p 'test_*.py' -v
      - name: Muse reader JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path('experiments/muse-artifact-reader/index.html').read_text()
          scripts = re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>', page, re.S)
          Path('/tmp/focu-muse-reader.js').write_text(scripts[-1])
          PY
          node --check /tmp/focu-muse-reader.js
  live-web:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Real external webpage smoke test
        env:
          FOCU_LIVE_TESTS: "1"
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v
