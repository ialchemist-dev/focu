# Example sources.yaml — copy to sources.yaml and make it yours.
version: 2
timezone: UTC
output_mode: audio

channels:
  - id: research
    name: "Research Digest"
    language: en
    voice: default
    max_minutes: 12

  - id: personal
    name: "Personal Briefing"
    language: en
    voice: default
    max_minutes: 6

sources:
  - name: "3Blue1Brown"
    type: youtube
    enabled: false  # experimental; enable after installing the youtube extra
    channel: research
    handle: "3blue1brown"
    notes: "Grant Sanderson's math channel"

  - name: "Elon Musk"
    type: x
    enabled: false  # collector not implemented
    channel: research
    username: "elonmusk"
    notes: "needs API or session; skipped gracefully without it"

  - name: "Andrej Karpathy"
    type: x
    enabled: false  # collector not implemented
    channel: research
    username: "karpathy"
    notes: "needs API or session; skipped gracefully without it"

  - name: "OpenAI News"
    type: rss
    channel: research
    feed_url: "https://openai.com/news/rss.xml"
    notes: "official announcements + blog posts; verified 2026-10-05"

  - name: "OpenAI Research"
    type: blog
    enabled: false  # HTML extraction is an M2 task; RSS already covers OpenAI
    channel: research
    site_url: "https://openai.com/research/"
    notes: "verified 2026-10-05: openai.com/research/ is an overview landing page — its publications all link to /index/ items already covered by the OpenAI News RSS; no separate scrape needed"

  - name: "OpenAI Index"
    type: blog
    enabled: false  # HTML extraction is an M2 task; RSS already covers OpenAI
    channel: research
    site_url: "https://openai.com/index/"
    notes: "verified 2026-10-05: the OpenAI News RSS already contains all /index/ announcements (1178 links, with pubDates) — covered via OpenAI News, no separate scrape needed"

  - name: "Anthropic News"
    type: blog
    enabled: false  # HTML collector planned for M2
    channel: research
    site_url: "https://www.anthropic.com/news"
    notes: "verified 2026-10-05: no official RSS configured; HTML collector not implemented"

  - name: "Anthropic Research"
    type: blog
    enabled: false  # HTML collector planned for M2
    channel: research
    site_url: "https://www.anthropic.com/research"
    notes: "verified 2026-10-05: no official RSS configured; HTML collector not implemented"

  - name: "Anthropic Engineering"
    type: blog
    enabled: false  # HTML collector planned for M2
    channel: research
    site_url: "https://www.anthropic.com/engineering"
    notes: "verified 2026-10-05: HTML collector not implemented"

  - name: "Ethan Mollick"
    type: rss
    channel: research
