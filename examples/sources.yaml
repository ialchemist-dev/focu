    notes: "Google AI official announcements; no official RSS known — verify blog structure during setup"

  - name: "Claude Blog"
    type: blog
    channel: research
    site_url: "https://claude.dev/blog/"
    notes: "Claude product blog on claude.dev (added 2026-10-20 at Jerry's instruction after the Oct 15 code-review post was missed: it is a separate publication from anthropic.com news/research/engineering); no RSS — check https://claude.dev/sitemap.xml for /blog/ entries by lastmod"
