# Example sources.yaml — copy to sources.yaml and make it yours.
version: 1

channels:
  - id: research
    name: "Research Digest"
    language: en
    voice: default
    max_minutes: 12

  - id: personal
    name: "Personal Briefing"
    language: en
    voice: default
    max_minutes: 6

sources:
  - name: "3Blue1Brown"
    type: youtube
    channel: research
    handle: "3blue1brown"
    notes: "Grant Sanderson's math channel"

  - name: "Elon Musk"
    type: x
    channel: research
    username: "elonmusk"
    notes: "needs API or session; skipped gracefully without it"

  - name: "Andrej Karpathy"
    type: x
    channel: research
    username: "karpathy"
    notes: "needs API or session; skipped gracefully without it"

  - name: "OpenAI News"
    type: rss
    channel: research
    feed_url: "https://openai.com/news/rss.xml"
    notes: "official announcements + blog posts; verified 2026-10-05"

  - name: "OpenAI Research"
    type: blog
    channel: research
    site_url: "https://openai.com/research/"
    notes: "verified 2026-10-05: openai.com/research/ is an overview landing page — its publications all link to /index/ items already covered by the OpenAI News RSS; no separate scrape needed"

  - name: "OpenAI Index"
    type: blog
    channel: research
    site_url: "https://openai.com/index/"
    notes: "verified 2026-10-05: the OpenAI News RSS already contains all /index/ announcements (1178 links, with pubDates) — covered via OpenAI News, no separate scrape needed"

  - name: "Anthropic News"
    type: anthropic
    channel: research
    section: news
    notes: "verified 2026-10-05: no official RSS; listing cards scraped from https://www.anthropic.com/news"

  - name: "Anthropic Research"
    type: anthropic
    channel: research
    section: research
    notes: "verified 2026-10-05: no official RSS; listing cards scraped from https://www.anthropic.com/research"

  - name: "Anthropic Engineering"
    type: anthropic
    channel: research
    section: engineering
    notes: "verified 2026-10-05: no official RSS; page is client-rendered — discovered via the official sitemap, titles from article og:title"

  - name: "Ethan Mollick"
    type: rss
    channel: research
    feed_url: "https://www.oneusefulthing.org/feed"

  - name: "北美王路飞"
    type: youtube
    channel: research
    channel_id: "UCmajVvuOjspOA9WtJGquDHA"
    notes: "YouTube creator (corrected by Jerry 2026-10-19: he is a YouTuber, not a LinkedIn source); many recent uploads are members-only with no public transcripts"

  - name: "Google DeepMind"
    type: blog
    channel: research
