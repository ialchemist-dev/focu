<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f7">
<title>Focu · Podcast Library</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf9f7;color:#242424;font:15px system-ui,-apple-system,sans-serif}header{position:sticky;top:0;background:#faf9f7ed;backdrop-filter:blur(12px);padding:18px max(20px,calc((100vw - 1100px)/2));border-bottom:1px solid #e9e5df;z-index:2}h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#777;font-size:13px}main{max-width:1100px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}}article{background:white;border:1px solid #eee9e4;border-radius:16px;overflow:hidden;box-shadow:0 3px 14px #00000006}article img,.placeholder{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:linear-gradient(145deg,#f5d7c7,#c5d5e5)}.placeholder{display:grid;place-items:center;font-size:36px}article .content{padding:12px}h2{font-size:14px;line-height:1.4;margin:0 0 8px}small{color:#777}button{background:#ee554c;color:white;border:0;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:600;margin-top:10px}audio{width:100%;margin-top:12px}#status{color:#777;margin-bottom:20px}.empty{padding:40px 12px;text-align:center;color:#666}.error{color:#a33}a{color:inherit}
</style>
<header><h1>Focu</h1><p>Your personal podcast library</p></header><main><div id="status">Loading podcasts…</div><div class="grid" id="grid"></div></main>
<script>
const grid=document.getElementById('grid'),status=document.getElementById('status');
const manifest=new URLSearchParams(location.search).get('manifest')||'episodes.json';
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function safeUrl(value){if(!value)return null;try{const u=new URL(value,location.href);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
async function load(){try{const response=await fetch(manifest,{cache:'no-store'});if(!response.ok)throw Error('Manifest HTTP '+response.status);const data=await response.json();const episodes=Array.isArray(data)?data:data.episodes;if(!Array.isArray(episodes))throw Error('Expected an episodes array');status.textContent=episodes.length+' episodes';if(!episodes.length)grid.append(el('p','No episodes yet.','empty'));for(const item of episodes){const card=el('article'),cover=safeUrl(item.cover_url),audio=safeUrl(item.audio_url);if(cover){const img=el('img');img.src=cover;img.alt=item.title||'Podcast cover';img.loading='lazy';card.append(img)}else card.append(el('div','🎧','placeholder'));const content=el('div',undefined,'content');content.append(el('h2',item.title||'Untitled episode'));content.append(el('small',[item.source,item.date].filter(Boolean).join(' · ')));if(audio){const player=el('audio');player.controls=true;player.preload='none';player.src=audio;content.append(player)}else content.append(el('p','Audio URL unavailable'));card.append(content);grid.append(card)}}catch(e){status.textContent='Unable to load podcast manifest: '+e.message;status.className='error'}}
load();
</script></html>
