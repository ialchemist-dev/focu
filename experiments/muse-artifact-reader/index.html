<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbfaf8">
<title>Focu · Reading Feed</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#252422;background:#fbfaf8;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fbfaf8}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #bd6258;outline-offset:3px}
header{position:sticky;top:0;z-index:5;background:#fbfaf8ed;backdrop-filter:blur(18px);border-bottom:1px solid #ebe8e2}
.head{max-width:760px;margin:auto;min-height:70px;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:24px;font-weight:800;letter-spacing:-1px}.brand .dot{color:#dd635b}
.nav{display:flex;gap:5px;align-items:center}
.nav button,.smallbutton{border:0;background:transparent;color:#77716b;padding:9px 12px;border-radius:12px;font-size:14px}
.nav button.active{color:#222;font-weight:700;background:#ece8e2}
.nav #refresh{padding:8px;font-size:17px}
main{max-width:760px;margin:0 auto;padding:25px 22px 70px}
.sectiontitle{font-size:12px;font-weight:700;color:#999189;letter-spacing:.13em;text-transform:uppercase;margin:0 0 15px}
#status{font-size:13px;color:#938b82;margin-bottom:21px}
.feed{display:flex;flex-direction:column;gap:0}
.feedcard{border:0;border-bottom:1px solid #ebe8e3;background:transparent;padding:18px 0;display:flex;gap:14px;width:100%;text-align:left;color:inherit;align-items:flex-start}
.feedcard:first-child{padding-top:2px}
.feedcard:hover .feedtitle{color:#b44e43}
.cardbody{flex:1;min-width:0}
.cardmeta,.byline{font-size:12px;color:#968e85;letter-spacing:.02em}
.feedtitle{font-size:20px;font-weight:690;letter-spacing:-.03em;line-height:1.35;margin:7px 0}
.feedsummary{font-size:14px;color:#77716b;line-height:1.55;margin:7px 0 0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.cover{width:88px;height:88px;object-fit:cover;border-radius:10px;flex-shrink:0;background:#eeeae5}
.empty{padding:60px 15px;text-align:center;color:#8e857b;line-height:1.7}
#reader[hidden],#feed[hidden],#playerbar[hidden],#toolbar[hidden]{display:none!important}
.readerback{border:0;background:none;color:#787067;padding:6px 0;margin-bottom:27px;font-size:14px}
.readercover{width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin-bottom:25px;background:#eee9e2}
#readertitle{font-size:clamp(30px,6.5vw,45px);letter-spacing:-.055em;line-height:1.13;margin:6px 0 18px;font-weight:790}
#readersummary{font-size:17px;color:#716b64;line-height:1.65;margin:0 0 23px}
.readeractions{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid #e9e5df;border-bottom:1px solid #e9e5df;margin-bottom:28px}
.listen{border:0;background:#242424;color:#fff;border-radius:24px;padding:10px 18px;font-weight:650;font-size:14px}
.readtime{color:#999189;font-size:12px}
#articlebody{font-size:17px;line-height:1.9;letter-spacing:-.008em;color:#37342e}
#articlebody p{margin:0 0 23px}#articlebody h2{font-size:24px;line-height:1.3;letter-spacing:-.03em;margin:38px 0 17px}
#articlebody h3{font-size:19px;margin:28px 0 12px}
#articlebody li{margin:0 0 12px 17px;padding-left:5px}
#articlebody blockquote{border-left:3px solid #d9ada0;margin:15px 0 24px;padding:0 16px;color:#68615c}
#articlebody a{color:#a94e45;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
#articlebody pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0ede8;padding:14px;border-radius:10px;font-size:13px;line-height:1.65}
.readend{margin:36px 0 15px;border-top:1px solid #e9e5df;padding-top:21px;text-align:center;color:#958c82;font-size:13px}
#readerstate{font-size:13px;color:#82786e;text-align:center;min-height:20px;margin:10px 0}.notice{font-size:12px;color:#8a7169;line-height:1.5}.listen:disabled{opacity:.55}
#restore{display:block;margin:10px auto;color:#826a60;text-decoration:underline;background:none;border:0;font-size:12px}
#playerbar{position:fixed;z-index:8;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5dfd8;box-shadow:0 -6px 24px #00000010;padding:9px 16px 12px}
.playinner{max-width:710px;margin:auto}
.playtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
#nowplaying{font-size:12px;color:#68615b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#closeaudio{border:0;background:none;color:#827d76;font-size:22px}
#player{display:block;width:100%;height:43px}
.error{color:#af443b!important}
#articlebody .noarticle{text-align:center;color:#777;font-size:15px}
@media(max-width:480px){.head{padding:10px 17px;min-height:64px}.brand{font-size:23px}.nav button{padding:8px 10px}main{padding:20px 18px 70px}.feedtitle{font-size:20px}.cover{width:92px;height:92px}.feedcard{gap:13px;padding:21px 0}#articlebody{font-size:16px;line-height:1.85}}
</style>
</head>
<body>
<header><div class="head"><div class="brand">focu<span class="dot">.</span></div><nav class="nav" aria-label="Library"><button id="inbox" class="active">Inbox</button><button id="archive">Archive</button><button id="researchtab">Research</button><button id="refresh" aria-label="Refresh" title="Refresh">↻</button></nav></div></header>
<main>
<section id="feed"><h1 class="sectiontitle" id="feedheading">For you to read</h1><div id="status" aria-live="polite">Loading…</div><div class="feed" id="grid"></div></section>
<section id="reader" hidden>
<button id="back" class="readerback">← Back to Inbox</button>
<img id="readercover" class="readercover" hidden alt="">
<div class="byline" id="readerbyline"></div>
<h1 id="readertitle"></h1>
<p id="readersummary"></p>
<div class="readeractions" id="toolbar"><button id="listen" class="listen" hidden>▶ Listen</button><span id="readtime" class="readtime"></span></div>
<div id="articlebody"></div>
<div class="readend" id="readend">End of article</div>
<div id="readerstate" aria-live="polite"></div>
<button id="restore" hidden>Restore to Inbox</button>
</section>
</main>
<div id="playerbar" hidden><div class="playinner"><div class="playtop"><span id="nowplaying"></span><button id="closeaudio" aria-label="Close player">×</button></div><audio id="player" controls preload="metadata"></audio></div></div>
<script id="embedded-episodes" type="application/json">{"episodes":[]}</script>
<script>
'use strict';
const grid=document.getElementById('grid'),status=document.getElementById('status'),refresh=document.getElementById('refresh');
const feed=document.getElementById('feed'),reader=document.getElementById('reader'),articleBody=document.getElementById('articlebody');
const player=document.getElementById('player'),playerbar=document.getElementById('playerbar'),readend=document.getElementById('readend');
const params=new URLSearchParams(location.search);
const STORE_KEY='focu:content-consumption:v1';
let view='inbox',allItems=[],allRequests=[],storageOK=true,currentId=null,readMs=0,maxDepth=0,bottomSeen=false,contentAvailable=false;
let tickAt=Date.now(),lastNote='',playingId=null,lastAudioPosition=null,listenedSeconds=0;
let speechId=null,speechSegments=[],speechIndex=0,speechRunning=false,speechPaused=false,failedAudioId=null,speechEpoch=0;
function canNarrate(){return !!(typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined')}
function readStates(){try{const obj=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');return obj&&typeof obj==='object'&&!Array.isArray(obj)?obj:{}}catch(e){storageOK=false;return {}}}
let states=readStates();
function saveStates(){try{const value=JSON.stringify(states);localStorage.setItem(STORE_KEY,value);storageOK=localStorage.getItem(STORE_KEY)===value}catch(e){storageOK=false}if(!storageOK)status.textContent='Reading history cannot be saved on this device'}
function isDone(id){return states[id]?.status==='consumed'}
function markDone(id,via){if(!id||isDone(id))return;states[id]={status:'consumed',via,updated_at:new Date().toISOString()};saveStates();render(allItems,lastNote);updateReaderState()}
function markUnread(id){delete states[id];saveStates();render(allItems,lastNote);updateReaderState()}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function safeUrl(value){if(typeof value!=='string'||!value.trim())return null;const v=value.trim();if(v.startsWith('//')){try{const u=new URL('https:'+v);return ['https:','http:','blob:'].includes(u.protocol)?v:null}catch{return null}}if(/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(v)){try{const u=new URL(v);return ['https:','http:','blob:'].includes(u.protocol)?v:null}catch{return null}}if(v.startsWith('/')||v.startsWith('\\\\')||v.includes('\\\\'))return null;return v}
function normalize(data){
 const a=Array.isArray(data)?data:(data&&Array.isArray(data.items)?data.items:data&&data.episodes);
 if(!Array.isArray(a))throw Error('Expected items or episodes array');
 const seen=new Set();
 return a.filter(x=>{const id=x&&(x.content_id||x.id);if(typeof id!=='string'||!id.trim()||seen.has(id))return false;seen.add(id);return true}).slice(0,500).map(x=>{
 const id=x.content_id||x.id;
 return {id,title:x.title||'Untitled',summary:x.summary||'',date:x.published_at||x.date||'',source:typeof x.source==='string'?x.source:(x.source?.kind||'Focu'),cover_url:x.cover?.path||x.cover_url||'',cover_origin:x.cover?.origin||'',audio_url:x.formats?.audio?.path||x.audio_url||'',audio_duration:Number(x.formats?.audio?.duration_seconds)||null,article_url:x.formats?.article?.path||'',blocks:Array.isArray(x.article_blocks)?x.article_blocks:[],reading_minutes:Number(x.reading_minutes)||0};
 });
}
function setView(which){if(speechRunning)stopNarration();view=which;currentId=null;reader.hidden=true;feed.hidden=false;document.getElementById('inbox').classList.toggle('active',which==='inbox');document.getElementById('archive').classList.toggle('active',which==='archive');document.getElementById('researchtab').classList.toggle('active',which==='research');document.getElementById('feedheading').textContent=which==='archive'?'Your Archive':which==='research'?'Research requests':'Latest stories';render(allItems,lastNote);window.scrollTo(0,0)}
document.getElementById('inbox').onclick=()=>setView('inbox');
document.getElementById('archive').onclick=()=>setView('archive');
document.getElementById('researchtab').onclick=()=>setView('research');
function render(items,note){
 allItems=items;lastNote=note;grid.replaceChildren();
 if(view==='research'){
   status.textContent=allRequests.length+' research requests · Snapshot at last publication';
   const info=el('p','Updates appear when Muse publishes a new snapshot.','feedsummary');
   grid.append(info);
   if(!allRequests.length){grid.append(el('p','No outstanding research. Completed reports appear in Inbox.','empty'));return}
   for(const request of allRequests){
     const card=el('div',undefined,'feedcard'),body=el('div',undefined,'cardbody');
     const labels={queued:'Queued',researching:'Researching',completed:'Research completed · Awaiting publication',failed:'Research failed'};
     body.append(el('div',labels[request.status]||'Unknown','cardmeta'));
     body.append(el('h2',request.title||'Untitled research','feedtitle'));
     if(request.status==='failed'&&request.error)body.append(el('p',request.error,'feedsummary'));
     card.append(body);grid.append(card);
   }
   return;
 }
 const visible=items.filter(x=>isDone(x.id)===(view==='archive'));
 status.textContent=visible.length+' '+(view==='archive'?'saved stories':'new stories')+(note?' · '+note:'')+(!storageOK?' · Reading state cannot be saved':'');
 if(!visible.length){grid.append(el('p',view==='archive'?'Nothing here yet. Finished stories will appear here.':'You are all caught up.','empty'));return}
 for(const item of visible){
 const card=el('button',undefined,'feedcard');card.type='button';card.onclick=()=>openItem(item.id);
 const body=el('div',undefined,'cardbody');
 body.append(el('div',[item.source,item.date].filter(Boolean).join('  ·  '),'cardmeta'));
 body.append(el('h2',item.title,'feedtitle'));
 if(item.summary)body.append(el('p',item.summary,'feedsummary'));

 card.append(body);
 const cover=safeUrl(item.cover_url);
 if(cover&&item.cover_origin!=='offline_art'){const img=el('img',undefined,'cover');img.src=cover;img.alt='';img.loading='lazy';img.onerror=()=>img.remove();card.append(img)}
 grid.append(card);
 }
}
function inline(parent,raw){
 const text=String(raw||'');const pattern=/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|\*\*([^*]+)\*\*/g;
 let match,last=0;
 while((match=pattern.exec(text))){parent.append(document.createTextNode(text.slice(last,match.index)));if(match[1]){const url=safeUrl(match[2]);if(url&&url.startsWith('http')){const a=el('a',match[1]);a.href=url;a.target='_blank';a.rel='noopener noreferrer';parent.append(a)}else parent.append(document.createTextNode(match[1]))}else{parent.append(el('strong',match[3]))}last=pattern.lastIndex}
 parent.append(document.createTextNode(text.slice(last).replace(/\*([^*]+)\*/g,'$1')));
}
function renderArticle(blocks,legacyUrl){
 articleBody.replaceChildren();
 if(!blocks.length){const url=safeUrl(legacyUrl);if(url){const p=el('p',undefined,'noarticle'),link=el('a','Open legacy article');link.href=url;link.target='_blank';link.rel='noopener noreferrer';p.append(link);articleBody.append(p)}else articleBody.append(el('p','This item has audio but no article yet.','noarticle'));return}
 let previousList=null;
 for(const block of blocks){
 if(!block||typeof block.text!=='string')continue;
 const type=block.type;
 if(type==='heading'&&block.level===1)continue;
 if(type==='bullet'){
 if(!previousList){previousList=el('ul');articleBody.append(previousList)}
 const li=el('li');inline(li,block.text);previousList.append(li);continue
 }
 previousList=null;
 let tag='p';
 if(type==='heading')tag=block.level<=2?'h2':'h3';
 else if(type==='quote')tag='blockquote';
 else if(type==='code')tag='pre';
 const node=el(tag);
 if(type==='code')node.textContent=block.text;else inline(node,block.text);
 articleBody.append(node);
 }
}
function updateReaderState(){
 if(!currentId)return;
 const done=isDone(currentId);
 document.getElementById('readerstate').textContent=done?'Finished · Saved in Archive':'';
 document.getElementById('restore').hidden=!done;
}
function openItem(id){
 const item=allItems.find(x=>x.id===id);if(!item)return;
 if(speechRunning&&speechId!==id)stopNarration();
 currentId=id;readMs=0;maxDepth=0;bottomSeen=false;contentAvailable=item.blocks.length>0;tickAt=Date.now();
 feed.hidden=true;reader.hidden=false;
 document.getElementById('back').textContent='← Back to '+(view==='archive'?'Archive':'Inbox');
 document.getElementById('readertitle').textContent=item.title;
 document.getElementById('readersummary').textContent=item.summary;
 document.getElementById('readerbyline').textContent=[item.source,item.date].filter(Boolean).join('  ·  ');
 document.getElementById('readtime').textContent=item.reading_minutes?item.reading_minutes+' min read':'';
 const cover=item.cover_origin==='offline_art'?null:safeUrl(item.cover_url),img=document.getElementById('readercover');img.hidden=!cover;
 if(cover){img.src=cover;img.onerror=()=>{img.hidden=true}}else img.removeAttribute('src');
 const listen=document.getElementById('listen');listen.hidden=!(safeUrl(item.audio_url)||item.blocks.length);listen.textContent=(safeUrl(item.audio_url)&&failedAudioId!==item.id)?'▶ Listen':'▶ Read aloud';
 const toolbar=document.getElementById('toolbar');toolbar.hidden=listen.hidden&&!item.blocks.length;
 renderArticle(item.blocks,item.article_url);updateReaderState();window.scrollTo(0,0);
}
document.getElementById('back').onclick=()=>{stopNarration();setView(view)};
document.getElementById('restore').onclick=()=>{if(currentId)markUnread(currentId)};
function stopNarration(){
 speechRunning=false;speechPaused=false;speechId=null;speechSegments=[];speechIndex=0;speechEpoch++;
 if(canNarrate())speechSynthesis.cancel();
}
function readableText(item){
 let section=false;
 return (item.blocks||[]).filter(b=>b&&typeof b.text==='string'&&b.type!=='code')
  .filter(b=>{if(b.type==='heading'&&String(b.text).trim().toLowerCase()==='sources')section=true;return !section})
  .map(b=>String(b.text).replace(/\[([^\]]+)\]\(https?:\/\/[^)]+\)/g,'$1')
       .replace(/[*_\x60#]/g,'').replace(/https?:\/\/\S+/g,'').trim()).filter(Boolean).join('. ');
}
function speechChunks(text){
 const result=[];let rest=text.replace(/\s+/g,' ').trim();
 while(rest.length){
   if(rest.length<=150){result.push(rest);break}
   let stop=Math.max(rest.lastIndexOf('. ',150),rest.lastIndexOf('! ',150),rest.lastIndexOf('? ',150),rest.lastIndexOf(' ',150));
   if(stop<60)stop=149;
   result.push(rest.slice(0,stop+1).trim());
   rest=rest.slice(stop+1).trim();
 }
 return result;
}
function nextSpeechChunk(){
 if(!speechRunning)return;
 if(speechIndex>=speechSegments.length){
   const completedId=speechId;stopNarration();
   markDone(completedId,'device_voice');return;
 }
 const epoch=speechEpoch;
 const utterance=new SpeechSynthesisUtterance(speechSegments[speechIndex]);
 utterance.lang='en-US';utterance.rate=1;
 utterance.onend=()=>{if(speechRunning&&!speechPaused&&epoch===speechEpoch){speechIndex++;nextSpeechChunk()}};
 utterance.onerror=event=>{
   if(!speechRunning||epoch!==speechEpoch)return;
   stopNarration();
   document.getElementById('readerstate').textContent='Device narration stopped ('+(event.error||'speech error')+'). This story was not archived.';
 };
 try{speechSynthesis.speak(utterance)}
 catch(e){stopNarration();document.getElementById('readerstate').textContent='Device narration is unavailable in this reader.'}
}
function readAloud(item){
 if(!canNarrate()){
  document.getElementById('readerstate').textContent='Device voice is unavailable here. Ask Muse to generate and cache a podcast.';return;
 }
 if(speechRunning&&speechId===item.id){
   if(speechPaused){speechSynthesis.resume();speechPaused=false;document.getElementById('listen').textContent='Ⅱ Pause reading'}
   else{speechSynthesis.pause();speechPaused=true;document.getElementById('listen').textContent='▶ Resume reading'}
   return;
 }
 const text=readableText(item);
 if(!text){document.getElementById('readerstate').textContent='There is no article text available for read-aloud.';return}
 player.pause();playerbar.hidden=true;stopNarration();
 speechSegments=speechChunks(text);speechIndex=0;speechId=item.id;speechRunning=true;speechPaused=false;
 document.getElementById('readerstate').textContent='Reading aloud using your device voice · No AI tokens';
 document.getElementById('listen').textContent='Ⅱ Pause reading';
 nextSpeechChunk();
}
document.getElementById('listen').onclick=()=>{
 const item=allItems.find(x=>x.id===currentId);if(!item)return;
 const url=safeUrl(item.audio_url);
 if(!url||failedAudioId===item.id){readAloud(item);return}
 stopNarration();
 if(playingId!==item.id){player.src=url;playingId=item.id;listenedSeconds=0;lastAudioPosition=null}
 playerbar.hidden=false;document.getElementById('nowplaying').textContent=item.title;
 player.play().catch(()=>{document.getElementById('nowplaying').textContent='Tap the native play control to start audio'});
};
document.getElementById('closeaudio').onclick=()=>{player.pause();playerbar.hidden=true};
player.addEventListener('seeking',()=>{lastAudioPosition=null});
player.addEventListener('timeupdate',()=>{
 if(player.paused||player.seeking||!Number.isFinite(player.currentTime))return;
 const current=player.currentTime;
 if(lastAudioPosition!==null){const diff=current-lastAudioPosition;if(diff>0&&diff<60)listenedSeconds+=diff}
 lastAudioPosition=current;
});
player.addEventListener('ended',()=>{
 const item=allItems.find(x=>x.id===playingId);
 if(item&&Number.isFinite(item.audio_duration)&&item.audio_duration>0&&
    player.currentTime<item.audio_duration*0.95){
   document.getElementById('nowplaying').textContent='Audio ended earlier than the verified file duration. Please report this playback problem.';
   return;
 }
 if(playingId&&Number.isFinite(player.duration)&&player.duration>0&&Math.max(listenedSeconds,playedCoverage())>=player.duration*0.8){markDone(playingId,'audio')}
 else document.getElementById('nowplaying').textContent='Playback ended · Not enough listening time to archive';
});
player.addEventListener('loadedmetadata',()=>{
 const item=allItems.find(x=>x.id===playingId);
 if(item&&item.audio_duration&&Number.isFinite(player.duration)&&
    Math.abs(player.duration-item.audio_duration)>Math.max(4,item.audio_duration*0.05)){
    document.getElementById('nowplaying').textContent='Player duration differs from verified audio · Try reopening if playback cuts off';
 }
});
player.addEventListener('stalled',()=>{document.getElementById('nowplaying').textContent='Playback stalled · Waiting for audio data'});

player.addEventListener('error',()=>{
 failedAudioId=playingId;
 document.getElementById('nowplaying').textContent='Podcast audio unavailable. You can still read the article.';
 if(currentId===playingId&&allItems.some(x=>x.id===currentId&&x.blocks.length)){
    document.getElementById('listen').textContent='▶ Read aloud';
    document.getElementById('readerstate').textContent='Cached audio could not load. Try device read-aloud instead.';
 }
});
function updateScroll(){
 if(!currentId||reader.hidden||!contentAvailable||isDone(currentId))return;
 const end=readend.getBoundingClientRect();const body=articleBody.getBoundingClientRect();
 maxDepth=Math.max(maxDepth,Math.max(0,Math.min(1,(innerHeight-body.top)/Math.max(1,body.height))));
 if(readend.getBoundingClientRect().top<innerHeight-55)bottomSeen=true;
}
window.addEventListener('scroll',updateScroll,{passive:true});
function playedCoverage(){let count=0;try{for(let i=0;i<player.played.length;i++)count+=player.played.end(i)-player.played.start(i)}catch(e){}return count}
function readingTick(){
 const now=Date.now(),delta=Math.min(2000,Math.max(0,now-tickAt));tickAt=now;
 if(!currentId||reader.hidden||document.hidden||!contentAvailable||isDone(currentId)||
    (playingId===currentId&&!player.paused)||(speechRunning&&speechId===currentId))return;
 readMs+=delta;updateScroll();
 const item=allItems.find(x=>x.id===currentId),textLen=item?item.blocks.reduce((n,b)=>n+String(b.text||'').length,0):0;
 const minMs=textLen<450?7000:textLen<1800?13000:20000;
 if(bottomSeen&&readMs>=minMs)markDone(currentId,'article');
}
setInterval(readingTick,1000);
document.addEventListener('visibilitychange',()=>{tickAt=Date.now()});
async function load(){refresh.disabled=true;status.className='';status.textContent='Loading stories…';try{let data,note='';const raw=document.getElementById('embedded-episodes').textContent;const snapshot=JSON.parse(raw);const embedded=normalize(snapshot);let current=snapshot;const manifest=params.get('manifest')||'assets/episodes.json';try{const url=safeUrl(manifest);if(!url)throw Error('Invalid manifest URL');const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const received=await response.json();data=normalize(received);current=received}catch(e){data=embedded;note='embedded snapshot (manifest unavailable)';if(!data.length)note='manifest unavailable; no embedded stories'}
allRequests=Array.isArray(current.research_requests)?current.research_requests.filter(r=>r&&typeof r.intent_id==='string'&&['queued','researching','failed','completed'].includes(r.status)).slice(0,100):[];
render(data,note)}catch(e){grid.replaceChildren();status.textContent='Unable to load stories: '+e.message;status.className='error'}finally{refresh.disabled=false}}
refresh.addEventListener('click',load);load();
</script>
</body>
</html>
